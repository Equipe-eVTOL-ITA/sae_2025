fase2_node:
  ros__parameters:
    takeoff_height: -2.8
    max_vertical_velocity: 1.0
    max_horizontal_velocity: 0.5

    estimated_distance: 4.3
    min_distance: 3.3
    max_distance: 5.3

    drop_height: -2.5

    horizontal_kp: 0.6
    horizontal_ki: 0.04
    horizontal_kd: 0.06

    yaw_kp: 0.1
    yaw_ki: 0.01
    yaw_kd: 0.01

    # SearchHose
    align_timeout: 45.0
    dist_tolerance: 0.05
    yaw_tolerance: 0.06

    # Return
    return_height: -1.5
    home_timeout: 20.0

    # Timeout for no detections
    lost_timeout: 100.0 # NUMERO DE IMAGENS SEM DETECÇÃO

    payload_drop_delay: 2.0
    

# Blue detector parameters
blue_detector:
  ros__parameters:
    image_topic: '/vertical_camera/compressed'
    processing_frequency: 10.0
    confidence_threshold: 0.1
    
    # Blue line detection parameters
    min_line_area: 100
    morph_kernel_size: 7
    morph_iterations: 3
    
    # Blue line HSV parameters (navy blue fabric)
    blue_lower_h: 70
    blue_lower_s: 60
    blue_lower_v: 25
    blue_upper_h: 150
    blue_upper_s: 255
    blue_upper_v: 255
    
    # Line following parameters
    roi_top: 0.2
    roi_bottom: 0.8
    min_line_length: 20
    max_line_gap: 60

# Red hose detector parameters
mangueira_detector:
  ros__parameters:
    image_topic: '/vertical_camera/compressed'
    processing_frequency: 10.0
    confidence_threshold: 0.2
    
    # Hose detection parameters
    min_hose_area: 200
    max_hose_area: 100000
    morph_kernel_size: 5
    morph_iterations: 2
    
    # Hose shape constraints
    min_aspect_ratio: 0.0
    max_aspect_ratio: 400.0
    min_hose_length: 100
    max_hose_width: 15000
    
    # Red hose HSV parameters (range 1: 0-10)
    red_lower1_h: 0
    red_lower1_s: 68
    red_lower1_v: 110
    red_upper1_h: 10
    red_upper1_s: 255
    red_upper1_v: 255
    
    # Red hose HSV parameters (range 2: 170-180)
    red_lower2_h: 170
    red_lower2_s: 60
    red_lower2_v: 100
    red_upper2_h: 180
    red_upper2_s: 255
    red_upper2_v: 255