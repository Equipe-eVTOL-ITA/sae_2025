fase1_fsm:
  ros__parameters:
    # Basic flight parameters
    takeoff_height: -1.7
    max_vertical_velocity: 1.0
    max_horizontal_velocity: 1.0
    
    # Slalom mission parameters
    total_poles: 4
    first_go_right: false
    rotation_speed: 0.3      # rad/s for searching poles
    approach_speed: 0.8      # m/s for approaching poles
    navigation_radius: 1.3   # m radius for circular navigation around poles
    angular_velocity: 0.3    # rad/s for circular navigation
    return_speed: 1.0        # m/s for returning to middle
    
    # Pole color sequence (colors to traverse in order)
    color_1: "Vermelho"          # First pole color
    color_2: "Azul"      # Second pole color  
    color_3: "Preto"         # Third pole color
    color_4: "Rosa"          # Fourth pole color
    
    # Search parameters
    max_search_time: 15.0    # seconds max search time per pole
    
    # Approach parameters
    goal_width: 0.15          # Target pole width in image (0.0-1.0)
    max_approach_time: 50.0  # seconds max approach time
    centering_tolerance: 0.03 # tolerance for pole centering (5%)
    
    # PID parameters for approach
    pid_yaw_kp: -2.0          # PID proportional gain for yaw control
    pid_yaw_ki: -0.01          # PID integral gain for yaw control
    pid_yaw_kd: -0.05         # PID derivative gain for yaw control
    pid_distance_kp: -0.35        # PID proportional gain for distance control - NEGATIVE SIGN because we want to decrease distance
    pid_distance_ki: -0.01        # PID integral gain for distance control
    pid_distance_kd: -0.02       # PID derivative gain for distance control
    
    # Navigation parameters
    max_navigation_time: 45.0 # seconds max navigation time around pole
    
    # Return parameters
    position_tolerance: 0.1   # meters tolerance for return position
    max_return_time: 30.0     # seconds max return time
    
    # New v2 parameters
    total_rotation_angle: 3.84  # 200 degrees in radians (200 * pi / 180)
    yaw_multiplier: 0.9         # Multiplier for yaw control timing
    lost_angle: 1.047           # 60 degrees in radians (pi/3)

post_detector:
  ros__parameters:
    # Image and processing parameters
    image_topic: '/camera/compressed'
    processing_frequency: 10.0  # Hz
    confidence_threshold: 0.37
    
    # Morphological operations parameters
    min_area: 600  # Increased to filter out small sky patches
    morph_kernel_size: 5
    morph_iterations: 2
    
    # Post detection constraints - Posts are vertical: 0.1m diameter, 2.5m height
    min_aspect_ratio: 0.02  # Very thin vertical objects (width/height)
    max_aspect_ratio: 0.4   # Still vertical, but allow some perspective distortion
    
    # HSV Color ranges for post detection - Made more restrictive to avoid sky
    # Preto (Black) - Low value for dark/black colors
    preto_lower_h: 0
    preto_lower_s: 0
    preto_lower_v: 0
    preto_upper_h: 360
    preto_upper_s: 95
    preto_upper_v: 70  # Reduced from 60 to avoid shadows
    
    # Azul (Blue) - Slightly less restrictive but still avoiding sky
    azul_lower_h: 76  # Slightly wider hue range
    azul_lower_s: 187  # Reduced saturation requirement
    azul_lower_v: 90   # Reduced value requirement
    azul_upper_h: 110  # Slightly wider hue range
    azul_upper_s: 255
    azul_upper_v: 248
    
    # Vermelho (Red) - Two ranges due to HSV wrap-around
    vermelho_lower1_h: 0
    vermelho_lower1_s: 68
    vermelho_lower1_v: 110
    vermelho_upper1_h: 10
    vermelho_upper1_s: 255
    vermelho_upper1_v: 255
    vermelho_lower2_h: 170
    vermelho_lower2_s: 60
    vermelho_lower2_v: 100
    vermelho_upper2_h: 180
    vermelho_upper2_s: 255
    vermelho_upper2_v: 255
    
    # Rosa (Pink)
    rosa_lower_h: 135
    rosa_lower_s: 50
    rosa_lower_v: 75
    rosa_upper_h: 170
    rosa_upper_s: 230
    rosa_upper_v: 217
