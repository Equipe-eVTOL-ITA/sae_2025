fase1_fsm:
  ros__parameters:
    # Basic flight parameters
    takeoff_height: -1.7
    max_vertical_velocity: 1.0
    max_horizontal_velocity: 1.0
    
    # Slalom mission parameters
    total_poles: 4
    rotation_speed: 0.5      # rad/s for searching poles
    approach_speed: 0.8      # m/s for approaching poles
    navigation_radius: 1.0   # m radius for circular navigation around poles
    angular_velocity: 0.3    # rad/s for circular navigation
    return_speed: 1.0        # m/s for returning to middle
    
    # Search parameters
    max_search_time: 30.0    # seconds max search time per pole
    
    # Approach parameters
    goal_width: 0.3          # Target pole width in image (0.0-1.0)
    max_approach_time: 20.0  # seconds max approach time
    centering_tolerance: 0.05 # tolerance for pole centering (5%)
    
    # PID parameters for approach
    pid_yaw_kp: 1.0          # PID proportional gain for yaw control
    pid_yaw_ki: 0.1          # PID integral gain for yaw control
    pid_yaw_kd: 0.05         # PID derivative gain for yaw control
    pid_width_kp: 0.5        # PID proportional gain for width control
    pid_width_ki: 0.1        # PID integral gain for width control
    pid_width_kd: 0.02       # PID derivative gain for width control
    
    # Navigation parameters
    max_navigation_time: 45.0 # seconds max navigation time around pole
    
    # Return parameters
    position_tolerance: 0.3   # meters tolerance for return position
    max_return_time: 30.0     # seconds max return time

landing_base_detector:
  ros__parameters:
    image_topic: '/vertical_camera/compressed'
    model: 'bases_v0'

post_detector:
  ros__parameters:
    # Image and processing parameters
    image_topic: '/horizontal_camera/compressed'
    processing_frequency: 10.0  # Hz
    confidence_threshold: 0.3
    
    # Morphological operations parameters
    min_area: 300  # Increased to filter out small sky patches
    morph_kernel_size: 5
    morph_iterations: 2
    
    # Post detection constraints - Posts are vertical: 0.1m diameter, 2.5m height
    min_aspect_ratio: 0.02  # Very thin vertical objects (width/height)
    max_aspect_ratio: 0.8   # Still vertical, but allow some perspective distortion
    
    # HSV Color ranges for post detection - Made more restrictive to avoid sky
    # Preto (Black) - Low value for dark/black colors
    preto_lower_h: 0
    preto_lower_s: 0
    preto_lower_v: 0
    preto_upper_h: 180
    preto_upper_s: 255
    preto_upper_v: 50  # Reduced from 60 to avoid shadows
    
    # Azul (Blue) - Slightly less restrictive but still avoiding sky
    azul_lower_h: 105  # Slightly wider hue range
    azul_lower_s: 110  # Reduced saturation requirement
    azul_lower_v: 85   # Reduced value requirement
    azul_upper_h: 125  # Slightly wider hue range
    azul_upper_s: 255
    azul_upper_v: 255
    
    # Vermelho (Red) - Two ranges due to HSV wrap-around
    vermelho_lower1_h: 0
    vermelho_lower1_s: 50
    vermelho_lower1_v: 50
    vermelho_upper1_h: 10
    vermelho_upper1_s: 255
    vermelho_upper1_v: 255
    vermelho_lower2_h: 170
    vermelho_lower2_s: 50
    vermelho_lower2_v: 50
    vermelho_upper2_h: 180
    vermelho_upper2_s: 255
    vermelho_upper2_v: 255
    
    # Rosa (Pink)
    rosa_lower_h: 140
    rosa_lower_s: 50
    rosa_lower_v: 50
    rosa_upper_h: 170
    rosa_upper_s: 255
    rosa_upper_v: 255
